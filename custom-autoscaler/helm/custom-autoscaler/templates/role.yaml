apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "custom-autoscaler.fullname" . }}-role
  labels: {{ include "custom-autoscaler.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "deployments"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
