apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-rolebinding" (include "custom-autoscaler.fullname" .) | quote }}
  labels: {{ include "custom-autoscaler.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ default .Release.Name .Values.serviceAccount.name | quote }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ printf "%s-role" (include "custom-autoscaler.fullname" .) | quote }}
  apiGroup: rbac.authorization.k8s.io
