replicaCount: 1

image:
  repository: custom-autoscaler
  tag: "0.0.1"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

containerPort: 8080

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

livenessProbe:
  enabled: true
  path: /actuator/health
  initialDelaySeconds: 50
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  path: /actuator/health
  initialDelaySeconds: 50
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# ServiceAccount configuration
serviceAccount:
  create: true
  name: custom-autoscaler
